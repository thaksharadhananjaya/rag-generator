spring:
  application:
    name: RagGeneratorApplication
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

springdoc:
  swagger-ui:
    path: /docs

# Application configuration. Secrets are read from the environment / .env and
# fall back to local-dev defaults so the context still starts without them.
app:
  openai:
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    api-key: ${OPENAI_API_KEY:}
    chat-model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
    embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    embedding-dimension: ${OPENAI_EMBEDDING_DIMENSION:1536}
    timeout-seconds: 60
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin123}
    bucket: ${MINIO_BUCKET:rag-documents}
  retrieval:
    top-k: 5
    min-score: 0.70
    max-context-tokens: 3000
  processing:
    chunk-size-tokens: 800
    min-chunk-size-chars: 350
  document:
    # Empty list => accept any content type (the extractor decides). See DocumentProperties for the default allow-list.
    allowed-content-types:
      - application/pdf
